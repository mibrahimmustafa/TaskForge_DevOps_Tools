[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge"
version = "0.2.0"
description = "Extensible CI/CD pipelines and DevOps task automation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "TaskForge Contributors"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "apscheduler>=3.10.0,<4.0.0",
    "pydantic>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=5.0.0",
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "bandit[toml]>=1.7.8",
    "httpx>=0.27.0"
]
postgres = [
    "asyncpg>=0.29.0"
]
browser = ["playwright>=1.50"]

[project.scripts]
taskforge = "taskforge.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["taskforge*"]

[tool.setuptools.package-data]
taskforge = ["dashboard/*.html", "dashboard/*.js", "dashboard/*.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["BLE001", "S102", "S110", "ASYNC230", "E501", "UP042", "SIM105"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
