services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: taskforge:local
    ports: ["127.0.0.1:8080:8080"]
    env_file: ../.taskforge/config.env
    environment:
      TASKFORGE_STORAGE_URL: postgresql+asyncpg://taskforge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/taskforge
      TASKFORGE_DATA_DIR: /data
    volumes: ["artifacts:/data"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  worker:
    image: taskforge:local
    command: ["taskforge", "worker", "start"]
    env_file: ../.taskforge/config.env
    environment:
      TASKFORGE_STORAGE_URL: postgresql+asyncpg://taskforge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/taskforge
      TASKFORGE_DATA_DIR: /data
    volumes: ["artifacts:/data"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskforge
      POSTGRES_DB: taskforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres:
  artifacts:
