name: Checks
on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --platform linux taskforge
      - run: mypy --platform win32 taskforge
      - run: bandit -r taskforge -c pyproject.toml --severity-level medium
      - run: python -m build
      - name: Verify installed wheel includes the dashboard
        run: |
          python -m venv /tmp/taskforge-wheel
          /tmp/taskforge-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/taskforge-wheel/bin/python -c "from importlib.resources import files; assert files('taskforge').joinpath('dashboard/index.html').is_file()"
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --cov=taskforge --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: taskforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskforge"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,postgres]'
      - run: python -m pytest tests/integration
        env:
          TASKFORGE_TEST_POSTGRES_URL: postgresql+asyncpg://taskforge:test-only-password@localhost:5432/taskforge_test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/browser
        env:
          TASKFORGE_BROWSER_TESTS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence
          path: test-results/
  container:
    runs-on: ubuntu-latest
    needs: [quality, test, postgres, browser]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build -f docker/Dockerfile -t taskforge:test .
      - name: Authenticated container smoke test
        run: |
          docker run -d --name taskforge-smoke -p 127.0.0.1:8080:8080 -e 'TASKFORGE_TOKENS=[{"name":"test","role":"admin","projects":["*"],"token":"test-only-container-token-000000000000000000"}]' taskforge:test
          trap 'docker logs taskforge-smoke; docker rm -f taskforge-smoke' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/ready && break || sleep 1; done
          curl -fsS http://127.0.0.1:8080/dashboard/
          curl -fsS -H 'Authorization: Bearer test-only-container-token-000000000000000000' http://127.0.0.1:8080/api/jobs
