name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_TAG']=='v'+version"
      - run: python -m build
      - name: Publish immutable image and release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build -f docker/Dockerfile --provenance=mode=max --sbom=true --push -t "$IMAGE:$RELEASE_TAG" --metadata-file image-metadata.json .
          export IMAGE
          python -c 'import json,os; digest=json.load(open("image-metadata.json"))["containerimage.digest"]; json.dump({"image":os.environ["IMAGE"]+"@"+digest},open("release.json","w"))'
          sha256sum dist/* release.json > SHA256SUMS
          gh release create "$RELEASE_TAG" dist/* release.json SHA256SUMS --verify-tag --generate-notes
